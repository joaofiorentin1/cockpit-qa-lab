[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    selenium: real-browser end-to-end tests (need Chrome + chromedriver)
    appium: Android UI automation through Appium (need an Appium server and an emulator)
    aaos_live: needs a running cockpit server on :8765 and the AAOS emulator (opt in with RUN_AAOS_LIVE=1)
