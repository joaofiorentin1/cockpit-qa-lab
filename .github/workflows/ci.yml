name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-api:
    name: Unit and API (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests with coverage
        run: >
          pytest -m "not selenium and not appium and not aaos_live"
          --cov=cockpit --cov=qa --cov=server --cov=adapters
          --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  e2e-selenium:
    name: E2E Selenium
    runs-on: ubuntu-latest
    needs: unit-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Selenium cockpit tests
        run: pytest -m selenium
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-qa-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
