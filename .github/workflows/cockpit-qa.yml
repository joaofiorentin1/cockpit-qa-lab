name: Cockpit QA Lab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Core simulator tests
        run: |
          python -m unittest discover -s tests -p 'test_cockpit.py' -v
          python -m unittest discover -s tests -p 'test_qa_runner.py' -v
          python -m unittest discover -s tests -p 'test_server_api.py' -v
          python -m unittest discover -s tests -p 'test_web_contract.py' -v
          python -m unittest discover -s tests -p 'test_socketcan_bridge.py' -v
      - name: Monkey / fuzz test (20,000 random commands)
        run: python -m unittest discover -s tests -p 'test_monkey.py' -v
      - name: Selenium cockpit test
        run: python -m unittest discover -s tests -p 'test_ui_selenium.py' -v
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-qa-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
